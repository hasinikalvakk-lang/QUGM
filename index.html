<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUGM Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: auto; }
        .header-panel { display: flex; gap: 20px; margin-bottom: 25px; }
        .card-ui { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; flex: 1; }
        .viz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .chart-card { background: #1e293b; padding: 15px; border-radius: 12px; height: 320px; border: 1px solid #334155; }
        .wide { grid-column: span 2; }
        .stats-inner { display: flex; justify-content: space-around; text-align: center; align-items: center; }
        input, button { padding: 10px; border-radius: 6px; border: none; margin-top: 10px; font-weight: bold; cursor: pointer;}
        button { background: #3b82f6; color: white; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .secondary { background: #10b981; }
        h2 { margin: 5px 0; color: #3b82f6; }
        small { color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h1>QUGM: Hybrid ML Glucose Monitor</h1>
    
    <div class="header-panel">
        <div class="card-ui">
            <h3>Generate Dataset</h3>
            <input type="number" id="genSize" value="500" style="width: 80px;">
            <button onclick="apiCall('/generate_data', {count: document.getElementById('genSize').value})">Build Synthetic Data</button>
        </div>
        <div class="card-ui">
            <h3>Upload Report</h3>
            <input type="file" id="csvFile" hidden onchange="uploadFile(event)">
            <button class="secondary" onclick="document.getElementById('csvFile').click()">Choose CSV File</button>
        </div>
    </div>

    <div class="card-ui" id="statsBar" style="display:none; margin-bottom: 25px; background: #1e293b;">
        <div class="stats-inner">
            <div><small>Samples</small><h2 id="statCount">0</h2></div>
            <div><small>Avg Glucose</small><h2 id="statAvg">0</h2></div>
            <div><small>PPG Corr</small><h2 id="statCorr">0</h2></div>
            <div><small>Peak Value</small><h2 id="statMax">0</h2></div>
            <div>
                <button class="secondary" onclick="window.location.href='/export_report'">📥 Export Active Report</button>
            </div>
        </div>
    </div>

    <div class="viz-grid">
        <div class="chart-card wide"><canvas id="trendChart"></canvas></div>
        <div class="chart-card"><canvas id="pieChart"></canvas></div>
        <div class="chart-card"><canvas id="scatterChart"></canvas></div>
        <div class="chart-card"><canvas id="ageChart"></canvas></div>
        <div class="chart-card"><canvas id="statsChart"></canvas></div>
    </div>
</div>

<script>
let charts = {};

async function apiCall(url, body) {
    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if(data.error) alert(data.error);
        else render(data);
    } catch (e) { console.error("API Error:", e); }
}

async function uploadFile(e) {
    const fd = new FormData();
    fd.append('file', e.target.files[0]);
    try {
        const res = await fetch('/upload_csv', { method: 'POST', body: fd });
        const data = await res.json();
        if(data.error) alert(data.error);
        else render(data);
    } catch (e) { console.error("Upload Error:", e); }
}

// Unified Render Function
function render(payload) {
    const { data, stats } = payload;
    
    // 1. Update the Text Statistics Bar
    document.getElementById('statsBar').style.display = 'block';
    document.getElementById('statCount').innerText = data.length;
    document.getElementById('statAvg').innerText = stats.summary.mean.toFixed(1);
    document.getElementById('statCorr').innerText = stats.correlation.toFixed(2);
    document.getElementById('statMax').innerText = stats.summary.max.toFixed(1);

    // 2. Clear previous charts
    Object.values(charts).forEach(c => c.destroy());

    // 3. Chart Helper
    const config = (type, labels, datasetLabel, values, color) => ({
        type,
        data: { 
            labels, 
            datasets: [{ 
                label: datasetLabel, 
                data: values, 
                backgroundColor: color, 
                borderColor: color, 
                tension: 0.3,
                pointRadius: type === 'line' ? 2 : 5
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { 
                legend: { labels: { color: 'white', font: { size: 12 } } } 
            },
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
            }
        }
    });

    // 4. Initialize Visuals
    charts.trend = new Chart(document.getElementById('trendChart'), config('line', data.slice(-100).map(d => d.timestamp), 'Glucose Trend (Last 100)', data.slice(-100).map(d => d.glucose_value), '#3b82f6'));

    charts.pie = new Chart(document.getElementById('pieChart'), config('doughnut', Object.keys(stats.categories), 'Risk Level', Object.values(stats.categories), ['#ef4444', '#10b981', '#f59e0b']));

    charts.scatter = new Chart(document.getElementById('scatterChart'), {
        type: 'scatter',
        data: { 
            datasets: [{ 
                label: 'PPG vs Glucose Correlation', 
                data: data.slice(0, 300).map(d => ({x: d.ppg_amplitude, y: d.glucose_value})), 
                backgroundColor: '#8b5cf6' 
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            scales: {
                x: { title: { display: true, text: 'PPG Amplitude', color: 'white' } },
                y: { title: { display: true, text: 'Glucose (mg/dL)', color: 'white' } }
            }
        }
    });

    charts.age = new Chart(document.getElementById('ageChart'), config('bar', Object.keys(stats.avg_by_age), 'Avg Glucose by Age Group', Object.values(stats.avg_by_age), '#10b981'));

    charts.stats = new Chart(document.getElementById('statsChart'), config('bar', ['Min', 'Mean', 'Max'], 'Statistical Variance', [stats.summary.min, stats.summary.mean, stats.summary.max], '#64748b'));
}
</script>
</body>
</html>
